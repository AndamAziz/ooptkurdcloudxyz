name: EnglishMaster CI

on:
  push:
    paths:
      - "android/**"
      - "backend/**"
      - "scripts/db/**"
      - ".github/workflows/englishmaster-ci.yml"
  pull_request:
    paths:
      - "android/**"
      - "backend/**"
      - "scripts/db/**"
      - ".github/workflows/englishmaster-ci.yml"

permissions:
  contents: read

jobs:
  database:
    name: Database migrations + pgTAP
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 16 and pgTAP
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16 postgresql-16-pgtap libtap-parser-sourcehandler-pgtap-perl
      - name: Seed is up to date with the CSV
        run: |
          python3 scripts/db/build_question_seed.py
          git diff --exit-code backend/supabase/seed/
      - name: Run migrations, seed and tests
        run: scripts/db/test-local.sh

  android:
    name: Android unit tests, lint, APKs
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;36.0.0" "platform-tools"
      - name: Test, lint and build
        run: ./gradlew --no-daemon test lintDebug assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            android/**/build/reports/
            android/**/build/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
