name: EnglishMaster CI

on:
  push:
    paths:
      - "android/**"
      - "backend/**"
      - "scripts/db/**"
      - "content/questions/**"
      - "scripts/release/**"
      - ".github/workflows/englishmaster-*.yml"
  pull_request:
    paths:
      - "android/**"
      - "backend/**"
      - "scripts/db/**"
      - "content/questions/**"
      - ".github/workflows/englishmaster-ci.yml"

permissions:
  contents: read

jobs:
  database:
    name: Database migrations + pgTAP
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 16 and pgTAP
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16 postgresql-16-pgtap libtap-parser-sourcehandler-pgtap-perl
      - name: Seed is up to date with the CSV
        run: |
          python3 scripts/db/build_question_seed.py
          python3 scripts/db/build_ai_question_seed.py
          git diff --exit-code backend/supabase/seed/
      - name: Run migrations, seed and tests
        run: scripts/db/test-local.sh

  android:
    name: Android unit tests, lint, APKs
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;36.0.0" "platform-tools"
      - name: Test, lint and build
        run: ./gradlew --no-daemon test lintDebug assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            android/**/build/reports/
            android/**/build/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release-readiness:
    name: Release secrets check (no publishing)
    runs-on: ubuntu-24.04
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Signing key decrypts and opens
        env:
          ANDROID_KEYSTORE_ENCRYPTION_KEY: ${{ secrets.ANDROID_KEYSTORE_ENCRYPTION_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then echo "::notice::signing secrets not configured; skipping"; exit 0; fi
          scripts/release/decode_keystore.sh "$RUNNER_TEMP/check.jks"
          rm -f "$RUNNER_TEMP/check.jks"
      - name: Supabase service key can read releases and see the bucket
        if: ${{ !cancelled() }}
        env:
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "::notice::SUPABASE_SERVICE_ROLE_KEY not configured; skipping"; exit 0; fi
          URL=$(sed -nE 's/^englishmaster.supabase.url=//p' android/gradle.properties)
          AUTH=(-H "apikey: $KEY"); [[ "$KEY" == sb_secret_* ]] || AUTH+=(-H "Authorization: Bearer $KEY")
          code=$(curl -s -o /dev/null -w '%{http_code}' "${AUTH[@]}" "$URL/rest/v1/app_releases?select=version_code&limit=1")
          [ "$code" = 200 ] || { echo "::error::SUPABASE_SERVICE_ROLE_KEY rejected by the REST API (HTTP $code)"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' "${AUTH[@]}" "$URL/storage/v1/bucket/app-releases")
          [ "$code" = 200 ] || { echo "::error::SUPABASE_SERVICE_ROLE_KEY cannot access the app-releases bucket (HTTP $code)"; exit 1; }
          echo "Supabase service key OK"
