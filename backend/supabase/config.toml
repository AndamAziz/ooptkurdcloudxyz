# Supabase CLI configuration for the EnglishMaster AI backend.
# Use with --workdir backend. Remote project ref: nefpgqoykfndjvrdultp (set by `supabase link`).
project_id = "englishmaster-ai"

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed/*.sql"]

[auth]
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true
